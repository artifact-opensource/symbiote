<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Symbiote</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --void: #08080c;
  --surface-0: #0c0c12;
  --surface-1: #12121a;
  --surface-2: #1a1a24;
  --surface-3: #22222e;
  --surface-4: #2a2a38;
  --text-primary: #e8e8ef;
  --text-secondary: #9a9aad;
  --text-tertiary: #6e6e81;
  --accent: #7c6aff;
  --accent-soft: rgba(124, 106, 255, 0.12);
  --accent-border: rgba(124, 106, 255, 0.32);
  --green: #34d399;
  --red: #f87171;
  --amber: #fbbf24;
  --border: rgba(255, 255, 255, 0.08);
  --radius: 12px;
  --radius-sm: 8px;
  --left-w: 280px;
  --right-w: 340px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: 'Inter', -apple-system, sans-serif;
  color: var(--text-primary);
  background: radial-gradient(circle at 15% -20%, rgba(124,106,255,0.15), transparent 40%), var(--void);
  overflow: hidden;
}
button, input, textarea { font: inherit; color: inherit; }
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-thumb { background: var(--surface-4); border-radius: 6px; }

.app { height: 100vh; display: grid; grid-template-columns: var(--left-w) minmax(0,1fr) var(--right-w); }
.panel {
  background: rgba(12, 12, 18, 0.92);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  min-width: 0;
}
.right-panel { border-right: none; border-left: 1px solid var(--border); }

.panel-header {
  min-height: 56px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 14px;
  border-bottom: 1px solid var(--border);
}
.brand { display: flex; align-items: center; gap: 10px; }
.brand-mark {
  width: 28px; height: 28px; border-radius: 8px;
  background: linear-gradient(135deg, var(--accent), #4f46e5);
  display: grid; place-items: center; font-size: 12px; font-weight: 700;
}
.brand-meta { display: flex; align-items: center; gap: 8px; }
.brand-version {
  font-size: 10px;
  color: var(--text-tertiary);
  font-family: 'JetBrains Mono', monospace;
  padding: 2px 6px;
  border: 1px solid var(--border);
  border-radius: 999px;
}

.icon-btn {
  border: 1px solid transparent;
  background: transparent;
  width: 32px; height: 32px;
  border-radius: 8px;
  display: inline-flex; align-items: center; justify-content: center;
  cursor: pointer;
  color: var(--text-secondary);
}
.icon-btn:hover { background: var(--surface-2); border-color: var(--border); color: var(--text-primary); }
.icon-btn svg { width: 18px; height: 18px; }

.new-chat-btn {
  margin: 12px;
  border: 1px solid var(--accent-border);
  background: var(--accent-soft);
  color: #b8acff;
  border-radius: var(--radius-sm);
  height: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  cursor: pointer;
  font-weight: 600;
}
.new-chat-btn:hover { filter: brightness(1.12); }
.session-list { overflow: auto; padding: 0 8px 10px; }
.session-group { margin-top: 10px; }
.session-group h4 {
  font-size: 10px;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--text-tertiary);
  padding: 0 8px 6px;
}
.session-item {
  display: grid;
  grid-template-columns: auto minmax(0,1fr) auto;
  gap: 8px;
  align-items: center;
  border-radius: 10px;
  padding: 10px;
  cursor: pointer;
}
.session-item:hover { background: var(--surface-2); }
.session-item.active { background: var(--surface-3); }
.session-item .title { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.session-item .preview { font-size: 11px; color: var(--text-tertiary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.session-del { opacity: 0; }
.session-item:hover .session-del { opacity: 1; }

.footer { margin-top: auto; border-top: 1px solid var(--border); padding: 10px 12px; }
.status-row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-secondary); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--red); }
.dot.online { background: var(--green); box-shadow: 0 0 10px rgba(52, 211, 153, 0.8); }

.main {
  display: grid;
  grid-template-rows: 56px minmax(0,1fr) auto;
  min-width: 0;
}
.topbar {
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 14px;
  background: rgba(18,18,26,0.86);
  backdrop-filter: blur(8px);
}
.topbar-left, .topbar-right { display: flex; align-items: center; gap: 8px; min-width: 0; }
.agent-name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.agent-model {
  font-size: 11px;
  color: var(--text-tertiary);
  font-family: 'JetBrains Mono', monospace;
  padding: 2px 8px;
  border-radius: 999px;
  border: 1px solid var(--border);
}
.kpi-badge {
  font-size: 11px;
  color: var(--green);
  border: 1px solid rgba(52, 211, 153, 0.28);
  background: rgba(52, 211, 153, 0.12);
  border-radius: 999px;
  padding: 3px 8px;
}

.reconnect {
  display: none;
  padding: 8px 12px;
  font-size: 12px;
  color: var(--amber);
  background: rgba(251,191,36,0.12);
  border-bottom: 1px solid rgba(251,191,36,0.25);
}
.reconnect.show { display: block; }

.chat-scroll { overflow: auto; }
.chat {
  max-width: 840px;
  margin: 0 auto;
  padding: 18px 18px 28px;
}
.welcome {
  margin: 36px 0;
  border: 1px solid var(--border);
  background: var(--surface-1);
  border-radius: 16px;
  padding: 24px;
}
.welcome h1 { font-size: 22px; margin-bottom: 8px; }
.welcome p { font-size: 14px; color: var(--text-secondary); line-height: 1.6; }
.quick-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
  margin-top: 16px;
}
.quick { border: 1px solid var(--border); background: var(--surface-2); color: var(--text-secondary); border-radius: 10px; padding: 12px; text-align: left; cursor: pointer; }
.quick:hover { color: var(--text-primary); border-color: var(--accent-border); }

.msg { padding-top: 14px; }
.msg-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.role { font-size: 13px; font-weight: 600; }
.role.assistant { color: #b5abff; }
.msg-time { font-size: 11px; color: var(--text-tertiary); font-family: 'JetBrains Mono', monospace; }
.msg-body { font-size: 14px; line-height: 1.68; border-bottom: 1px solid var(--border); padding-bottom: 12px; white-space: pre-wrap; word-break: break-word; }
.msg-body code { font-family: 'JetBrains Mono', monospace; background: var(--surface-2); padding: 2px 6px; border-radius: 4px; }

.streaming { color: var(--text-secondary); font-size: 13px; padding: 6px 0 12px; }

.composer {
  border-top: 1px solid var(--border);
  background: linear-gradient(to top, rgba(12,12,18,1), rgba(12,12,18,.88));
  padding: 14px;
}
.input-shell {
  max-width: 840px;
  margin: 0 auto;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--surface-1);
  padding: 8px;
}
.input-row { display: flex; gap: 8px; align-items: flex-end; }
textarea {
  width: 100%;
  min-height: 40px;
  max-height: 180px;
  resize: none;
  border: none;
  outline: none;
  background: transparent;
  color: var(--text-primary);
  padding: 8px;
}
.send {
  width: 40px; height: 40px; border: none; border-radius: 10px;
  background: var(--accent); color: #fff; cursor: pointer;
}
.send:disabled { opacity: 0.32; cursor: not-allowed; }
.input-note {
  margin-top: 6px;
  font-size: 11px;
  color: var(--text-tertiary);
  display: flex;
  justify-content: space-between;
}

.right-scroll { overflow: auto; padding: 10px 12px 12px; }
.section {
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--surface-1);
  margin-bottom: 10px;
}
.section h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--text-tertiary); padding: 10px 12px; border-bottom: 1px solid var(--border); }
.stat-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px; padding: 10px; }
.stat { border: 1px solid var(--border); border-radius: 10px; padding: 8px; background: var(--surface-2); }
.stat .k { font-size: 10px; color: var(--text-tertiary); text-transform: uppercase; }
.stat .v { margin-top: 4px; font-size: 14px; font-weight: 600; }

.flow-list, .tool-list { list-style: none; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.flow-item, .tool-item { border: 1px solid var(--border); border-radius: 10px; background: var(--surface-2); padding: 8px; }
.flow-top, .tool-top { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.flow-category, .tool-name { font-size: 13px; font-weight: 600; color: #c9c2ff; }
.flow-meta, .tool-meta { font-size: 11px; color: var(--text-tertiary); font-family: 'JetBrains Mono', monospace; }
.cmd {
  margin-top: 6px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: #c2cedf;
  background: #101622;
  border: 1px solid #1f2937;
  border-radius: 8px;
  padding: 6px;
  white-space: pre-wrap;
  word-break: break-word;
}
.empty { color: var(--text-tertiary); font-size: 12px; padding: 12px; }

.overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.62); z-index: 80; }

@media (max-width: 1200px) {
  .app { grid-template-columns: var(--left-w) minmax(0,1fr); }
  .right-panel { position: fixed; right: 0; top: 0; bottom: 0; width: min(90vw, var(--right-w)); z-index: 95; transform: translateX(100%); transition: transform .2s ease; }
  .right-panel.open { transform: translateX(0); }
}

@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0,1fr); }
  .panel.left { position: fixed; left: 0; top: 0; bottom: 0; width: min(92vw, var(--left-w)); z-index: 95; transform: translateX(-100%); transition: transform .2s ease; }
  .panel.left.open { transform: translateX(0); }
  .overlay.show { display: block; }
  .agent-model { display: none; }
  .quick-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="overlay" id="overlay" onclick="closePanels()"></div>
<div class="app">
  <aside class="panel left" id="leftPanel">
    <div class="panel-header">
      <div class="brand">
        <div class="brand-mark">M6</div>
        <div class="brand-meta">
          <strong>Symbiote</strong>
          <span class="brand-version" id="versionBadge"></span>
        </div>
      </div>
      <button class="icon-btn" onclick="toggleLeftPanel()" title="Collapse sidebar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
    </div>

    <button class="new-chat-btn" onclick="createSession()">+ New conversation</button>
    <div class="session-list" id="sessionList"></div>

    <div class="footer">
      <div class="status-row"><span class="dot" id="statusDot"></span><span id="statusText">Connecting...</span></div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="topbar-left">
        <button class="icon-btn" onclick="toggleLeftPanel()" title="Sessions">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <div class="agent-name" id="agentName">Agent</div>
        <div class="agent-model" id="agentModel"></div>
      </div>
      <div class="topbar-right">
        <span class="kpi-badge" id="latencyBadge" style="display:none"></span>
        <button class="icon-btn" onclick="toggleRightPanel()" title="Insights">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="21" x2="4" y2="14"/><line x1="12" y1="21" x2="12" y2="10"/><line x1="20" y1="21" x2="20" y2="3"/></svg>
        </button>
        <button class="icon-btn" onclick="clearChat()" title="Clear current session">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
        </button>
      </div>
    </header>

    <div class="reconnect" id="reconnectBar">Connection lost. Retrying…</div>

    <div class="chat-scroll" id="chatScroll">
      <div class="chat" id="chat"></div>
    </div>

    <div class="composer">
      <div class="input-shell">
        <div class="input-row">
          <textarea id="input" placeholder="Send a message…" oninput="autoResize(this)" onkeydown="handleKey(event)"></textarea>
          <button class="send" id="sendBtn" onclick="sendMessage()" disabled>
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </button>
        </div>
        <div class="input-note"><span>Enter to send · Shift+Enter for newline</span><span>Local web UI</span></div>
      </div>
    </div>
  </main>

  <aside class="panel right-panel" id="rightPanel">
    <div class="panel-header">
      <strong style="font-size:13px;">Session insights</strong>
      <button class="icon-btn" onclick="toggleRightPanel()" title="Close insights">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="right-scroll">
      <section class="section">
        <h3>Current turn</h3>
        <div class="stat-grid" id="turnStats"></div>
      </section>

      <section class="section">
        <h3>Reasoning flow</h3>
        <ul class="flow-list" id="flowList"></ul>
      </section>

      <section class="section">
        <h3>Tool calls & commands</h3>
        <ul class="tool-list" id="toolList"></ul>
      </section>
    </div>
  </aside>
</div>

<script>
var API_BASE = window.location.origin;
var appState = {
  agentName: 'Agent',
  providerModel: '',
  streaming: false,
  reconnectTimer: null,
  retryDelay: 3000,
  lastTelemetry: { latencyMs: 0, iterations: 0, toolCalls: [], temperatureHistory: [] }
};

function loadSessions() { try { return JSON.parse(localStorage.getItem('symbiote_sessions') || '[]'); } catch { return []; } }
function saveSessions(v) { localStorage.setItem('symbiote_sessions', JSON.stringify(v)); }
function activeId() { return localStorage.getItem('symbiote_active_session') || ''; }
function setActiveId(v) { localStorage.setItem('symbiote_active_session', v); }
function msgKey(id) { return 'symbiote_msg_' + id; }
function loadMessages(id) { try { return JSON.parse(localStorage.getItem(msgKey(id)) || '[]'); } catch { return []; } }
function saveMessages(id, msgs) { localStorage.setItem(msgKey(id), JSON.stringify(msgs)); }

function ensureSession() {
  var sessions = loadSessions();
  if (!sessions.length) createSession();
  if (!activeId() && sessions.length) setActiveId(sessions[0].id);
}

function createSession() {
  var id = 'sess_' + Date.now() + '_' + Math.random().toString(36).slice(2,8);
  var sessions = loadSessions();
  sessions.unshift({ id: id, title: 'New conversation', preview: '', created: Date.now() });
  saveSessions(sessions);
  setActiveId(id);
  renderSessions();
  renderChat();
  closePanels();
}

function deleteSession(id, ev) {
  if (ev) ev.stopPropagation();
  var sessions = loadSessions().filter(function(s){ return s.id !== id; });
  saveSessions(sessions);
  localStorage.removeItem(msgKey(id));
  if (activeId() === id) {
    if (sessions.length) setActiveId(sessions[0].id);
    else return createSession();
  }
  renderSessions();
  renderChat();
}

function switchSession(id) {
  setActiveId(id);
  renderSessions();
  renderChat();
  closePanels();
}

function updatePreview(id, txt) {
  var sessions = loadSessions();
  for (var i = 0; i < sessions.length; i++) {
    if (sessions[i].id === id) {
      sessions[i].preview = txt.slice(0, 90);
      if (sessions[i].title === 'New conversation' && txt.trim()) sessions[i].title = txt.slice(0, 58);
      break;
    }
  }
  saveSessions(sessions);
}

function renderSessions() {
  var list = document.getElementById('sessionList');
  var sessions = loadSessions();
  var aid = activeId();
  if (!sessions.length) {
    list.innerHTML = '<div class="empty">No conversations yet.</div>';
    return;
  }
  var now = Date.now(), day = 86400000;
  var buckets = { today: [], week: [], older: [] };
  sessions.forEach(function(s){
    var age = now - (s.created || now);
    if (age < day) buckets.today.push(s);
    else if (age < 7 * day) buckets.week.push(s);
    else buckets.older.push(s);
  });
  list.innerHTML = renderSessionGroup('Today', buckets.today, aid) + renderSessionGroup('This week', buckets.week, aid) + renderSessionGroup('Older', buckets.older, aid);
}

function renderSessionGroup(label, items, aid) {
  if (!items.length) return '';
  var html = '<section class="session-group"><h4>' + label + '</h4>';
  items.forEach(function(s){
    var active = s.id === aid ? ' active' : '';
    html += '<article class="session-item' + active + '" onclick="switchSession(\'' + s.id + '\')">'
      + '<div>💬</div>'
      + '<div><div class="title">' + escapeHtml(s.title) + '</div>'
      + (s.preview ? '<div class="preview">' + escapeHtml(s.preview) + '</div>' : '') + '</div>'
      + '<button class="icon-btn session-del" onclick="deleteSession(\'' + s.id + '\', event)" title="Delete"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>'
      + '</article>';
  });
  return html + '</section>';
}

function renderChat() {
  var root = document.getElementById('chat');
  var sid = activeId();
  var msgs = loadMessages(sid);
  if (!msgs.length) {
    root.innerHTML = renderWelcome();
    updateInsights(null);
    return;
  }
  var html = '';
  msgs.forEach(function(m){ html += renderMessage(m); });
  root.innerHTML = html;
  var lastAssistant = null;
  for (var i = msgs.length - 1; i >= 0; i--) { if (msgs[i].role === 'assistant') { lastAssistant = msgs[i]; break; } }
  updateInsights(lastAssistant);
  scrollBottom();
}

function renderWelcome() {
  return '<section class="welcome">'
    + '<h1>Ready.</h1>'
    + '<p>Direct chat with the live Symbiote runtime. Session insights on the right show actual reasoning categories, tool calls, and command inputs from the last assistant turn.</p>'
    + '<div class="quick-grid">'
    + '<button class="quick" onclick="useSuggestion(this)">Inspect this repository and summarize architecture.</button>'
    + '<button class="quick" onclick="useSuggestion(this)">Find failing tests and suggest fixes.</button>'
    + '<button class="quick" onclick="useSuggestion(this)">Run a security review for changed files.</button>'
    + '<button class="quick" onclick="useSuggestion(this)">List recently used tools and why they were used.</button>'
    + '</div></section>';
}

function useSuggestion(btn) {
  var input = document.getElementById('input');
  input.value = btn.textContent.trim();
  autoResize(input);
  sendMessage();
}

function renderMessage(m) {
  var roleName = m.role === 'user' ? 'You' : appState.agentName;
  var time = m.time ? new Date(m.time).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
  return '<article class="msg">'
    + '<div class="msg-head"><span class="role ' + m.role + '">' + roleName + '</span>'
    + (time ? '<span class="msg-time">' + time + '</span>' : '') + '</div>'
    + '<div class="msg-body">' + renderText(m.content || '') + '</div>'
    + '</article>';
}

function renderText(text) {
  var escaped = escapeHtml(text);
  escaped = escaped.replace(/`([^`]+)`/g, '<code>$1</code>');
  return escaped;
}

function sendMessage() {
  var input = document.getElementById('input');
  var text = input.value.trim();
  if (!text || appState.streaming) return;

  var sid = activeId();
  if (!sid) { createSession(); sid = activeId(); }

  var msgs = loadMessages(sid);
  msgs.push({ role: 'user', content: text, time: Date.now() });
  saveMessages(sid, msgs);
  updatePreview(sid, text);
  renderSessions();

  var root = document.getElementById('chat');
  if (root.querySelector('.welcome')) root.innerHTML = '';
  root.insertAdjacentHTML('beforeend', renderMessage({ role: 'user', content: text, time: Date.now() }));

  var pendingId = 'pending_' + Date.now();
  root.insertAdjacentHTML('beforeend', '<article class="msg" id="' + pendingId + '"><div class="msg-head"><span class="role assistant">' + appState.agentName + '</span></div><div class="streaming">Thinking…</div></article>');

  appState.streaming = true;
  document.getElementById('sendBtn').disabled = true;
  input.value = '';
  autoResize(input);
  scrollBottom();

  var started = Date.now();
  var responseText = '';
  var responseTelemetry = { latencyMs: 0, iterations: 0, toolCalls: [], temperatureHistory: [] };

  fetch(API_BASE + '/api/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ sessionId: sid, message: text })
  }).then(function(res){
    if (!res.ok) throw new Error('HTTP ' + res.status);
    var reader = res.body.getReader();
    var decoder = new TextDecoder();
    var buffer = '';

    function updatePending() {
      var el = document.getElementById(pendingId);
      if (!el) return;
      el.innerHTML = '<div class="msg-head"><span class="role assistant">' + appState.agentName + '</span></div><div class="msg-body">' + renderText(responseText || '…') + '</div>';
      scrollBottom();
    }

    function consumeLine(line) {
      var s = line.trim();
      if (!s.startsWith('data: ')) return;
      var payload = s.slice(6);
      if (!payload) return;
      try {
        var evt = JSON.parse(payload);
        if (evt.type === 'text') {
          responseText += evt.content || '';
          updatePending();
          return;
        }
        if (evt.type === 'done') {
          var msg = evt.message || {};
          responseTelemetry.latencyMs = Number(msg.latencyMs || 0);
          responseTelemetry.iterations = Number(msg.iterations || 0);
          responseTelemetry.toolCalls = Array.isArray(msg.toolCalls) ? msg.toolCalls : [];
          responseTelemetry.temperatureHistory = Array.isArray(msg.temperatureHistory) ? msg.temperatureHistory : [];
          return;
        }
      } catch {
        responseText += payload;
        updatePending();
      }
    }

    function pump() {
      return reader.read().then(function(chunk){
        if (chunk.done) return;
        buffer += decoder.decode(chunk.value, { stream: true });
        var lines = buffer.split('\n');
        buffer = lines.pop() || '';
        lines.forEach(consumeLine);
        return pump();
      });
    }

    return pump();
  }).then(function(){
    finishTurn(sid, pendingId, responseText, responseTelemetry, started);
  }).catch(function(err){
    var el = document.getElementById(pendingId);
    if (el) {
      el.innerHTML = '<div class="msg-head"><span class="role assistant">' + appState.agentName + '</span></div><div class="msg-body" style="color:var(--red)">Request failed: ' + escapeHtml(err.message) + '</div>';
    }
    appState.streaming = false;
    document.getElementById('sendBtn').disabled = false;
  });
}

function finishTurn(sessionId, pendingId, text, telemetry, started) {
  var latency = telemetry.latencyMs || (Date.now() - started);
  var msg = {
    role: 'assistant',
    content: text || '(no response)',
    time: Date.now(),
    latencyMs: latency,
    iterations: telemetry.iterations || 0,
    toolCalls: telemetry.toolCalls || [],
    temperatureHistory: telemetry.temperatureHistory || []
  };

  var msgs = loadMessages(sessionId);
  msgs.push(msg);
  saveMessages(sessionId, msgs);
  updatePreview(sessionId, msg.content);
  renderSessions();

  var pending = document.getElementById(pendingId);
  if (pending) pending.outerHTML = renderMessage(msg);

  appState.lastTelemetry = {
    latencyMs: msg.latencyMs || 0,
    iterations: msg.iterations || 0,
    toolCalls: msg.toolCalls || [],
    temperatureHistory: msg.temperatureHistory || []
  };
  updateInsights(msg);

  var badge = document.getElementById('latencyBadge');
  badge.textContent = ((msg.latencyMs || 0) / 1000).toFixed(1) + 's';
  badge.style.display = 'inline-flex';
  setTimeout(function(){ badge.style.display = 'none'; }, 5000);

  appState.streaming = false;
  document.getElementById('sendBtn').disabled = false;
  scrollBottom();
}

function updateInsights(lastAssistant) {
  var telemetry = lastAssistant ? {
    latencyMs: Number(lastAssistant.latencyMs || 0),
    iterations: Number(lastAssistant.iterations || 0),
    toolCalls: Array.isArray(lastAssistant.toolCalls) ? lastAssistant.toolCalls : [],
    temperatureHistory: Array.isArray(lastAssistant.temperatureHistory) ? lastAssistant.temperatureHistory : []
  } : appState.lastTelemetry;

  renderStats(telemetry);
  renderReasoningFlow(telemetry.temperatureHistory);
  renderTools(telemetry.toolCalls);
}

function renderStats(t) {
  var nodes = [
    { k: 'Latency', v: t.latencyMs ? (t.latencyMs / 1000).toFixed(2) + 's' : '—' },
    { k: 'Iterations', v: t.iterations || 0 },
    { k: 'Tool calls', v: t.toolCalls.length },
    { k: 'Commands', v: t.toolCalls.filter(function(c){ return extractCommand(c); }).length }
  ];
  document.getElementById('turnStats').innerHTML = nodes.map(function(n){
    return '<div class="stat"><div class="k">' + n.k + '</div><div class="v">' + n.v + '</div></div>';
  }).join('');
}

function renderReasoningFlow(flow) {
  var root = document.getElementById('flowList');
  if (!flow || !flow.length) {
    root.innerHTML = '<li class="empty">No reasoning flow metadata returned for this turn.</li>';
    return;
  }
  root.innerHTML = flow.map(function(item){
    return '<li class="flow-item"><div class="flow-top"><span class="flow-category">' + escapeHtml(String(item.category || 'general')) + '</span><span class="flow-meta">iter ' + Number(item.iteration || 0) + '</span></div><div class="flow-meta">temp ' + Number(item.temperature || 0).toFixed(2) + '</div></li>';
  }).join('');
}

function renderTools(calls) {
  var root = document.getElementById('toolList');
  if (!calls || !calls.length) {
    root.innerHTML = '<li class="empty">No tool calls in the latest turn.</li>';
    return;
  }
  root.innerHTML = calls.map(function(tc, idx){
    var cmd = extractCommand(tc);
    var input = JSON.stringify(tc.input || {});
    if (input.length > 220) input = input.slice(0, 220) + '…';
    return '<li class="tool-item">'
      + '<div class="tool-top"><span class="tool-name">' + escapeHtml(tc.name || ('tool-' + idx)) + '</span><span class="tool-meta">#' + (idx + 1) + '</span></div>'
      + '<div class="tool-meta">input</div><div class="cmd">' + escapeHtml(input) + '</div>'
      + (cmd ? '<div class="tool-meta" style="margin-top:6px;">command</div><div class="cmd">' + escapeHtml(cmd) + '</div>' : '')
      + '</li>';
  }).join('');
}

function extractCommand(tc) {
  if (!tc || !tc.input || typeof tc.input !== 'object') return '';
  var input = tc.input;
  var fields = ['command', 'cmd', 'shell', 'script', 'url', 'path', 'target'];
  for (var i = 0; i < fields.length; i++) {
    var v = input[fields[i]];
    if (typeof v === 'string' && v.trim()) return v.trim();
  }
  return '';
}

function clearChat() {
  var sid = activeId();
  if (!sid) return;
  saveMessages(sid, []);
  var sessions = loadSessions();
  for (var i = 0; i < sessions.length; i++) {
    if (sessions[i].id === sid) { sessions[i].title = 'New conversation'; sessions[i].preview = ''; }
  }
  saveSessions(sessions);
  appState.lastTelemetry = { latencyMs: 0, iterations: 0, toolCalls: [], temperatureHistory: [] };
  renderSessions();
  renderChat();
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 180) + 'px';
  document.getElementById('sendBtn').disabled = !el.value.trim() || appState.streaming;
}

function handleKey(ev) {
  if (ev.key === 'Enter' && !ev.shiftKey) {
    ev.preventDefault();
    sendMessage();
  }
}

function escapeHtml(s) {
  var d = document.createElement('div');
  d.textContent = String(s || '');
  return d.innerHTML;
}

function scrollBottom() {
  var area = document.getElementById('chatScroll');
  requestAnimationFrame(function(){ area.scrollTop = area.scrollHeight; });
}

function toggleLeftPanel() {
  var left = document.getElementById('leftPanel');
  if (window.innerWidth <= 900) {
    left.classList.toggle('open');
    syncOverlay();
    return;
  }
  document.documentElement.style.setProperty('--left-w', getComputedStyle(document.documentElement).getPropertyValue('--left-w').trim() === '72px' ? '280px' : '72px');
}

function toggleRightPanel() {
  var right = document.getElementById('rightPanel');
  if (window.innerWidth <= 1200) {
    right.classList.toggle('open');
    syncOverlay();
    return;
  }
  document.documentElement.style.setProperty('--right-w', getComputedStyle(document.documentElement).getPropertyValue('--right-w').trim() === '72px' ? '340px' : '72px');
}

function closePanels() {
  document.getElementById('leftPanel').classList.remove('open');
  document.getElementById('rightPanel').classList.remove('open');
  syncOverlay();
}

function syncOverlay() {
  var openLeft = document.getElementById('leftPanel').classList.contains('open');
  var openRight = document.getElementById('rightPanel').classList.contains('open');
  document.getElementById('overlay').classList.toggle('show', openLeft || openRight);
}

function checkConnection() {
  return fetch(API_BASE + '/api/config').then(function(r){ return r.json(); }).then(function(cfg){
    appState.agentName = cfg.agentName || 'Agent';
    appState.providerModel = (cfg.provider || '') + (cfg.model ? ' / ' + cfg.model : '');
    document.getElementById('agentName').textContent = appState.agentName;
    document.getElementById('agentModel').textContent = appState.providerModel;
    document.getElementById('versionBadge').textContent = cfg.version || '';
    document.getElementById('statusDot').classList.add('online');
    document.getElementById('statusText').textContent = appState.agentName + ' · online';
    document.getElementById('reconnectBar').classList.remove('show');
    appState.retryDelay = 3000;
    clearTimeout(appState.reconnectTimer);
  }).catch(function(){
    document.getElementById('statusDot').classList.remove('online');
    document.getElementById('statusText').textContent = 'offline';
    document.getElementById('reconnectBar').classList.add('show');
    clearTimeout(appState.reconnectTimer);
    appState.reconnectTimer = setTimeout(checkConnection, appState.retryDelay);
    appState.retryDelay = Math.min(Math.floor(appState.retryDelay * 1.5), 30000);
  });
}

(function init(){
  ensureSession();
  renderSessions();
  renderChat();
  checkConnection();
  setInterval(checkConnection, 30000);
  var input = document.getElementById('input');
  input.focus();
  autoResize(input);
  window.addEventListener('resize', syncOverlay);
})();
</script>
</body>
</html>
