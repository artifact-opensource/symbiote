<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Symbiote — Persistent AI Agent Framework</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            letter-spacing: -0.015em;
            overflow-x: hidden;
        }
        .font-mono {
            font-family: 'Geist Mono', monospace;
        }
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #000000;
        }
        ::-webkit-scrollbar-thumb {
            background: #222222;
            border-radius: 2px;
        }
    </style>
</head>
<body class="bg-black text-white min-h-screen flex flex-col justify-between selection:bg-white selection:text-black">

    <!-- LEFT SIDEBAR -->
    <aside class="fixed left-0 top-0 h-screen w-16 border-r border-neutral-900 bg-black/90 backdrop-blur-md z-50 flex flex-col items-center justify-between py-8">
        <div></div>
        <div class="flex flex-col items-center gap-8 text-neutral-500">
            <a href="#hero" class="hover:text-white transition-colors" title="Terminal"><i class="fa-solid fa-terminal text-sm"></i></a>
            <a href="https://github.com/artifact-opensource/symbiote" target="_blank" class="hover:text-white transition-colors" title="GitHub"><i class="fa-brands fa-github text-sm"></i></a>
            <a href="#install" class="hover:text-white transition-colors" title="Install"><i class="fa-solid fa-download text-sm"></i></a>
        </div>
        <div></div>
    </aside>

    <!-- RIGHT SIDEBAR -->
    <aside class="fixed right-0 top-0 h-screen w-16 border-l border-neutral-900 bg-black/90 backdrop-blur-md z-50 flex flex-col items-center justify-between py-8">
        <div></div>
        <div class="flex flex-col items-center gap-8 text-neutral-500">
            <div class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse" title="System Live"></div>
            <a href="https://github.com/artifact-opensource/symbiote" target="_blank" class="hover:text-white transition-colors" title="Code Branch"><i class="fa-solid fa-code-branch text-sm"></i></a>
            <a href="https://github.com/artifact-opensource/symbiote" target="_blank" class="hover:text-white transition-colors" title="Documentation"><i class="fa-solid fa-book text-sm"></i></a>
        </div>
        <div></div>
    </aside>

    <!-- MAIN HERO CONTENT -->
    <main id="hero" class="flex-1 flex flex-col items-center justify-center px-4 sm:px-6 md:px-12 ml-16 mr-16 min-h-screen text-center relative py-12">
        
        <!-- Background Ambient Glow -->
        <div class="absolute w-[240px] h-[240px] sm:w-[350px] sm:h-[350px] md:w-[600px] md:h-[600px] bg-gradient-to-tr from-neutral-900 to-neutral-800 rounded-full blur-3xl opacity-20 -z-10 pointer-events-none"></div>

        <!-- Logo -->
        <div class="mb-8 flex items-center justify-center">
            <img src="../assets/av-black-logo-removebg-preview.png" alt="Artifact Virtual Logo" class="w-16 h-16 sm:w-20 sm:h-20 object-contain invert brightness-200">
        </div>

        <!-- Main Headline -->
        <h1 class="text-3xl sm:text-5xl md:text-7xl font-light tracking-tight max-w-4xl leading-[1.15] mb-4 sm:mb-6">
            Stateful AI, simplified.
        </h1>

        <!-- Subheading -->
        <p class="text-neutral-400 text-sm sm:text-lg md:text-xl max-w-xl font-light leading-relaxed mb-8 px-2">
            Long-running workflows and drop-in persistence for your local AI
        </p>

        <!-- Command Install Box -->
        <div id="install" class="w-full max-w-xs sm:max-w-sm bg-neutral-950 border border-neutral-800 rounded-lg p-1.5 sm:p-2 flex items-center justify-between text-left shadow-2xl transition-all">
            <div class="flex items-center gap-2.5 pl-2.5 overflow-hidden min-w-0">
                <i class="fa-solid fa-terminal text-neutral-500 text-xs shrink-0"></i>
                <code class="text-xs sm:text-sm text-neutral-200 truncate font-mono select-all">npm install -g symbiote</code>
            </div>
            <button id="copy-btn" onclick="navigator.clipboard.writeText('npm install -g symbiote'); const icon=this.querySelector('i'); icon.className='fa-solid fa-check text-xs'; setTimeout(() => icon.className='fa-regular fa-clone text-xs', 2000);" title="Copy to clipboard" class="w-7 h-7 sm:w-8 sm:h-8 flex items-center justify-center bg-white text-black hover:bg-neutral-200 rounded transition-colors shrink-0 ml-2">
                <i class="fa-regular fa-clone text-xs"></i>
            </button>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="ml-16 mr-16 py-6 border-t border-neutral-900 text-center text-neutral-600 text-[11px] flex flex-col md:flex-row justify-between items-center px-6 gap-3">
        <div>&copy; 2026 Artifact Open Source. All rights reserved.</div>
        <div class="flex gap-4">
            <a href="https://github.com/artifact-opensource/symbiote" target="_blank" class="hover:text-neutral-400">GitHub</a>
            <a href="https://github.com/artifact-opensource/symbiote/blob/main/LICENSE" target="_blank" class="hover:text-neutral-400">MIT License</a>
        </div>
    </footer>

</body>
</html>
