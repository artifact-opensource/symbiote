name: Build and publish release assets

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            webapp/package-lock.json
      - run: npm ci
      - run: npm --prefix webapp ci
      - name: Verify release metadata
        run: npm run check:release -- "${GITHUB_REF_NAME}"
      - name: Audit dependencies
        run: |
          npm audit --audit-level=high
          npm --prefix webapp audit --audit-level=high
      - run: npm run build
      - name: Unit, integration, and security regression tests
        run: npm test

  linux-package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            webapp/package-lock.json
      - run: npm ci
      - run: npm --prefix webapp ci
      - run: npm run build
      - name: Package Linux npm distribution
        shell: bash
        run: |
          mkdir -p release-assets
          npm pack --pack-destination release-assets
          npm sbom --package-lock-only --sbom-format=spdx --sbom-type=application > release-assets/symbiote-linux.spdx.json
          npm --prefix webapp sbom --package-lock-only --sbom-format=spdx --sbom-type=application > release-assets/symbiote-webapp-linux.spdx.json
          cd release-assets
          sha256sum *.tgz > SHA256SUMS-linux.txt
      - uses: actions/upload-artifact@v7
        with:
          name: linux-release-assets
          path: release-assets/*
          if-no-files-found: error

  windows-msi:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            webapp/package-lock.json
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm --prefix webapp ci
      - run: npm run build:msi
      - name: Generate SPDX SBOMs
        run: |
          npm sbom --package-lock-only --sbom-format=spdx --sbom-type=application > dist/windows-installer/symbiote-windows.spdx.json
          npm --prefix webapp sbom --package-lock-only --sbom-format=spdx --sbom-type=application > dist/windows-installer/symbiote-webapp-windows.spdx.json
      - uses: actions/upload-artifact@v7
        with:
          name: windows-release-assets
          path: |
            dist/windows-installer/*.msi
            dist/windows-installer/SHA256SUMS-windows.txt
            dist/windows-installer/*.spdx.json
          if-no-files-found: error

  github-package:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            webapp/package-lock.json
          registry-url: https://npm.pkg.github.com
          scope: '@artifact-opensource'
      - run: npm ci
      - run: npm --prefix webapp ci
      - run: npm run build
      - name: Publish package to GitHub Packages
        run: |
          npm pkg set name=@artifact-opensource/symbiote
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: [linux-package, windows-msi, github-package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: Symbiote ${{ github.ref_name }}
          body_path: docs/releases/RELEASE_NOTES_${{ github.ref_name }}.md
          files: release-assets/*
