name: Build and publish release assets

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            webapp/package-lock.json
      - run: npm ci
      - run: npm --prefix webapp ci
      - run: npm run build
      - run: node --test --test-concurrency=1 dist/test/*.test.js

  linux-package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            webapp/package-lock.json
      - run: npm ci
      - run: npm --prefix webapp ci
      - run: npm run build
      - name: Package Linux npm distribution
        shell: bash
        run: |
          mkdir -p release-assets
          npm pack --pack-destination release-assets
          cd release-assets
          sha256sum *.tgz > SHA256SUMS-linux.txt
      - uses: actions/upload-artifact@v4
        with:
          name: linux-release-assets
          path: release-assets/*
          if-no-files-found: error

  windows-msi:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            webapp/package-lock.json
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm --prefix webapp ci
      - run: npm run build:msi
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release-assets
          path: dist/windows-installer/*
          if-no-files-found: error

  github-package:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            webapp/package-lock.json
          registry-url: https://npm.pkg.github.com
          scope: '@artifact-opensource'
      - run: npm ci
      - run: npm --prefix webapp ci
      - run: npm run build
      - name: Publish package to GitHub Packages
        run: |
          npm pkg set name=@artifact-opensource/symbiote
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: [linux-package, windows-msi, github-package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: Symbiote ${{ github.ref_name }}
          body_path: RELEASE_NOTES_v5.6.1.md
          files: release-assets/*
