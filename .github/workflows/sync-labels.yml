name: Sync repository labels

on:
  push:
    paths:
      - .github/labels.json
      - .github/workflows/sync-labels.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v9
        with:
          script: |
            const fs = require('node:fs');
            const labels = JSON.parse(fs.readFileSync('.github/labels.json', 'utf8'));
            if (!Array.isArray(labels)) {
              throw new Error('.github/labels.json must contain a label array.');
            }

            const existing = await github.paginate(github.rest.issues.listLabelsForRepo, {
              ...context.repo,
              per_page: 100,
            });
            const byName = new Map(existing.map(label => [label.name.toLowerCase(), label]));

            for (const label of labels) {
              if (!label || typeof label.name !== 'string'
                || !/^[0-9a-f]{6}$/i.test(label.color)
                || typeof label.description !== 'string') {
                throw new Error(`Invalid label definition: ${JSON.stringify(label)}`);
              }

              const current = byName.get(label.name.toLowerCase());
              if (!current) {
                await github.rest.issues.createLabel({ ...context.repo, ...label });
                core.info(`Created label: ${label.name}`);
              } else if (current.color.toLowerCase() !== label.color.toLowerCase()
                || current.description !== label.description) {
                await github.rest.issues.updateLabel({
                  ...context.repo,
                  name: current.name,
                  color: label.color,
                  description: label.description,
                });
                core.info(`Updated label: ${label.name}`);
              } else {
                core.info(`Label is current: ${label.name}`);
              }
            }
